<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="https://kelosocial.sirv.com/logo.png"><title>Ma demande — Kelo Social Help</title><link rel="stylesheet" href="styles.css"><style>.ticket-page{min-height:calc(100vh - 135px);background:#fafbfc}.ticket-shell{max-width:860px;margin:auto;padding:52px 28px 80px}.ticket-shell h1{font-size:40px;margin:0 0 8px}.ticket-meta{color:#667085}.public-thread{display:grid;gap:12px;margin:25px 0;max-height:60vh;overflow:auto}.msg{padding:16px;border:1px solid #e4e7ec;border-radius:12px;background:#fff}.msg.admin{background:#f7f8ff}.msg small{color:#667085;font-weight:700}.msg p{white-space:pre-wrap;line-height:1.6;color:#344054}.reply-form{display:grid;gap:12px;background:#fff;border:1px solid #e4e7ec;border-radius:12px;padding:20px}.reply-form textarea{width:100%;box-sizing:border-box;border:1px solid #d0d5dd;border-radius:8px;padding:13px;font:inherit;resize:vertical}.state{padding:25px;border:1px solid #e4e7ec;border-radius:10px;background:#fff;color:#667085}@media(max-width:760px){.ticket-shell{padding:35px 20px}.ticket-shell h1{font-size:32px}}</style></head><body><header class="site-header"><div class="header-inner"><a class="brand" href="index.html"><img src="https://kelosocial.sirv.com/logo.png" class="brand-logo" alt=""><span>Kelo Social</span><span class="brand-divider"></span><strong>Centre d’aide</strong></a><nav class="header-nav"><a href="index.html">Centre d’aide</a><a href="https://kelosocial.eu">Kelo Social</a></nav></div></header><main class="ticket-page"><div class="ticket-shell"><a class="form-back" href="index.html">← Centre d’aide</a><div id="state" class="state">Chargement…</div><section id="app" hidden><p class="eyebrow">VOTRE DEMANDE</p><h1 id="subject"></h1><p id="meta" class="ticket-meta"></p><div id="thread" class="public-thread"></div><form id="form" class="reply-form"><label>Votre réponse<textarea id="message" rows="7" maxlength="8000" required placeholder="Écrivez votre réponse…"></textarea></label><button class="primary-button">Envoyer ma réponse</button><p id="status" class="form-status"></p></form></section></div></main><script>
const t=new URLSearchParams(location.search).get("token")||"",state=document.querySelector("#state"),app=document.querySelector("#app"),thread=document.querySelector("#thread"),form=document.querySelector("#form"),msg=document.querySelector("#message"),st=document.querySelector("#status");const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));async function load(){const r=await fetch("/api/ticket?token="+encodeURIComponent(t)),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Impossible de charger la demande.");document.querySelector("#subject").textContent=d.contact.subject;document.querySelector("#meta").textContent="Demande du "+new Date(d.contact.created_at).toLocaleString("fr-BE");thread.innerHTML=d.messages.map(x=>`<article class="msg ${x.author_role==="admin"?"admin":""}"><small>${x.author_role==="admin"?"Kelo Social":"Vous"} · ${new Date(x.created_at).toLocaleString("fr-BE")}</small><p>${esc(x.message)}</p></article>`).join("");state.hidden=true;app.hidden=false}form.addEventListener("submit",async e=>{e.preventDefault();const b=form.querySelector("button");b.disabled=true;try{const r=await fetch("/api/ticket?token="+encodeURIComponent(t),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:msg.value})}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Impossible d’envoyer la réponse.");msg.value="";st.textContent="Votre réponse a été ajoutée à la conversation.";st.className="form-status success";await load()}catch(e){st.textContent=e.message;st.className="form-status error"}finally{b.disabled=false}});load().catch(e=>{state.textContent=e.message;state.className="state error"});
</script></body></html>
